<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Express Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>🍴 Food Express</h2>
        <p>Delicious Food, Fast Delivery</p>
    </nav>

    <!-- Restaurant Header -->
    <section class="hero">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"
             alt="Restaurant Food">

        <div class="hero-content">
            <h2>Food Express Restaurant</h2>
            <p>⭐ 4.5 | 30-40 mins</p>
            <p>Pizza, Burger, Dosa and Brownie.</p>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu-section">
        <h2>Our Menu</h2>

        <div class="menu-container">

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"
                     alt="Pizza">
                <h3>Pizza</h3>
                <p>₹250</p>
                <button onclick="addToCart('Pizza',250)">
                    Add to Cart
                </button>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"
                     alt="Burger">
                <h3>Burger</h3>
                <p>₹150</p>
                <button onclick="addToCart('Burger',150)">
                    Add to Cart
                </button>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400"
                     alt="Dosa">
                <h3>Dosa</h3>
                <p>₹80</p>
                <button onclick="addToCart('Dosa',80)">
                    Add to Cart
                </button>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400"
                     alt="Brownie">
                <h3>Brownie</h3>
                <p>₹100</p>
                <button onclick="addToCart('Brownie',100)">
                    Add to Cart
                </button>
            </div>

        </div>
    </section>

    <!-- Cart Section -->
    <section class="cart-section">
        <h2>My Cart</h2>

        <div id="cart-items">
            <p>Your cart is empty</p>
        </div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button class="checkout-btn" onclick="openPayment()">
            Proceed to Payment
        </button>
    </section>

    <!-- Payment Section -->
    <div id="payment-box" class="payment-box">

        <div class="payment-content">
            <span class="close" onclick="closePayment()">×</span>

            <h2>Payment Details</h2>

            <label>Customer Name</label>
            <input type="text" id="customer-name"
                   placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number">

            <label>Address</label>
            <textarea id="address"
                      placeholder="Enter your address"></textarea>

            <label>Payment Method</label>
            <select id="payment-method">
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
            </select>

            <button onclick="placeOrder()">
                Place Order
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
